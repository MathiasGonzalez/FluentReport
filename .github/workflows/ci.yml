name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal

      - name: Generate sample files (PDF + Excel)
        run: dotnet run --project samples/FluentReport.Samples --configuration Release -- sample-files

      - name: Upload sample files
        uses: actions/upload-artifact@v4
        with:
          name: sample-files
          path: sample-files/
          if-no-files-found: error
