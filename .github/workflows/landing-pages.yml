name: landing-pages

on:
  push:
    branches: [ "main" ]
    paths:
      - '.github/workflows/landing-pages.yml'
      - 'README.md'
      - 'logo.png'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build landing page
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Generate landing page
        run: |
          mkdir -p _site
          cp logo.png _site/logo.png
          cat > _site/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1.0" />
            <title>FluentReport — .NET report generation library</title>
            <style>
              *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
              body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #0d1117; color: #e6edf3; line-height: 1.6; }
              a { color: #58a6ff; text-decoration: none; }
              a:hover { text-decoration: underline; }
              header { padding: 64px 24px 32px; text-align: center; }
              header img { width: 96px; height: 96px; object-fit: contain; margin-bottom: 24px; }
              header h1 { font-size: 2.4rem; font-weight: 700; margin-bottom: 8px; }
              header p { font-size: 1.1rem; color: #8b949e; max-width: 560px; margin: 0 auto 24px; }
              .badges { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-bottom: 16px; }
              .badges img { height: 20px; }
              main { max-width: 860px; margin: 0 auto; padding: 0 24px 64px; }
              h2 { font-size: 1.3rem; font-weight: 600; margin: 40px 0 16px; border-bottom: 1px solid #30363d; padding-bottom: 8px; }
              table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
              th, td { padding: 8px 12px; text-align: left; border-bottom: 1px solid #30363d; }
              th { color: #8b949e; font-weight: 600; }
              code { background: #161b22; border: 1px solid #30363d; border-radius: 4px; padding: 2px 6px; font-size: 0.85em; }
              pre { background: #161b22; border: 1px solid #30363d; border-radius: 6px; padding: 16px; overflow-x: auto; font-size: 0.85rem; margin: 16px 0; }
              .cta { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin: 32px 0; }
              .btn { display: inline-block; padding: 10px 22px; border-radius: 6px; font-weight: 600; font-size: 0.95rem; }
              .btn-primary { background: #238636; color: #fff; border: 1px solid #2ea043; }
              .btn-primary:hover { background: #2ea043; text-decoration: none; }
              .btn-secondary { background: #21262d; color: #e6edf3; border: 1px solid #30363d; }
              .btn-secondary:hover { background: #30363d; text-decoration: none; }
              footer { text-align: center; padding: 24px; color: #8b949e; font-size: 0.85rem; border-top: 1px solid #30363d; }
            </style>
          </head>
          <body>
            <header>
              <img src="logo.png" alt="FluentReport logo" />
              <h1>FluentReport</h1>
              <p>.NET 10 library for generating PDF, Excel, and HTML reports using a fluent C# API — with built-in AI-agent support via MCP.</p>
              <div class="badges">
                <img src="https://github.com/MathiasGonzalez/FluentReport/actions/workflows/ci.yml/badge.svg" alt="CI" />
                <img src="https://img.shields.io/nuget/v/FluentReport.Core.svg?label=FluentReport.Core" alt="NuGet" />
                <img src="https://img.shields.io/nuget/v/FluentReport.svg?label=FluentReport" alt="NuGet" />
              </div>
            </header>

            <main>
              <div class="cta">
                <a class="btn btn-primary" href="https://github.com/MathiasGonzalez/FluentReport">View on GitHub</a>
                <a class="btn btn-secondary" href="https://www.nuget.org/packages/FluentReport">NuGet packages</a>
                <a class="btn btn-secondary" href="https://github.com/MathiasGonzalez/FluentReport/blob/main/docs/agent-quickstart.md">Agent quickstart</a>
              </div>

              <h2>Packages</h2>
              <table>
                <thead><tr><th>Package</th><th>Description</th></tr></thead>
                <tbody>
                  <tr><td><a href="https://www.nuget.org/packages/FluentReport"><code>FluentReport</code></a></td><td>PDF renderer (SkiaSharp — Linux compatible)</td></tr>
                  <tr><td><a href="https://www.nuget.org/packages/FluentReport.Excel"><code>FluentReport.Excel</code></a></td><td>Excel (.xlsx) renderer (ClosedXML)</td></tr>
                  <tr><td><a href="https://www.nuget.org/packages/FluentReport.Html"><code>FluentReport.Html</code></a></td><td>HTML/email renderer (inline styles)</td></tr>
                  <tr><td><a href="https://www.nuget.org/packages/FluentReport.Rdlc"><code>FluentReport.Rdlc</code></a></td><td>RDLC/SSRS importer</td></tr>
                  <tr><td><a href="https://www.nuget.org/packages/FluentReport.Schema"><code>FluentReport.Schema</code></a></td><td>YAML/JSON schema importer + validator</td></tr>
                  <tr><td><a href="https://www.nuget.org/packages/FluentReport.Core"><code>FluentReport.Core</code></a></td><td>Core model (custom renderer base)</td></tr>
                </tbody>
              </table>

              <h2>Quick start</h2>
              <pre><code>dotnet add package FluentReport           # PDF
          dotnet add package FluentReport.Excel     # + Excel
          dotnet add package FluentReport.Html      # + HTML/email
          dotnet add package FluentReport.Schema    # + YAML/JSON schema
          dotnet tool install -g FluentReport.Mcp   # MCP server for AI agents</code></pre>

              <h2>AI-first design</h2>
              <p>FluentReport is designed to be used directly by AI coding agents. Install the MCP server and let your agent validate schemas, preview HTML, and render PDFs — all from the chat window.</p>
              <pre><code>dotnet tool install -g FluentReport.Mcp</code></pre>
              <p>See the <a href="https://github.com/MathiasGonzalez/FluentReport/blob/main/docs/agent-quickstart.md">agent quickstart</a> for a complete end-to-end guide.</p>

              <h2>Documentation</h2>
              <table>
                <thead><tr><th>Document</th><th>Description</th></tr></thead>
                <tbody>
                  <tr><td><a href="https://github.com/MathiasGonzalez/FluentReport/blob/main/docs/agent-quickstart.md">Agent quickstart</a></td><td>Minimal end-to-end flow, binding syntax, common errors</td></tr>
                  <tr><td><a href="https://github.com/MathiasGonzalez/FluentReport/blob/main/docs/api.md">API reference</a></td><td>All builders and methods</td></tr>
                  <tr><td><a href="https://github.com/MathiasGonzalez/FluentReport/blob/main/docs/schema/report-schema.md">YAML schema reference</a></td><td>Schema contract, binding grammar, style precedence</td></tr>
                  <tr><td><a href="https://github.com/MathiasGonzalez/FluentReport/blob/main/src/FluentReport.Mcp/README.md">MCP server setup</a></td><td>Use FluentReport from any AI agent via MCP</td></tr>
                </tbody>
              </table>
            </main>

            <footer>
              FluentReport is open-source software released under the MIT license.
            </footer>
          </body>
          </html>
          EOF

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy landing page
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4