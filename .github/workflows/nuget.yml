name: Publish to NuGet

# Publishes when a release tag is pushed (e.g. v2.0.0). The package version comes from the tag,
# so every release produces new package versions instead of being skipped as a duplicate.
on:
  push:
    tags: [ "v*.*.*" ]
  workflow_dispatch:
    inputs:
      version:
        description: "Package version to publish (e.g. 2.0.1)"
        required: true

jobs:
  publish:
    name: Pack & Publish
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      VERSION: ${{ inputs.version || github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Resolve version
        run: echo "PACKAGE_VERSION=${VERSION#v}" >> "$GITHUB_ENV"

      - name: Restore dependencies
        run: dotnet restore

      - name: Build (Release)
        run: dotnet build --no-restore --configuration Release -p:Version=$PACKAGE_VERSION

      - name: Test
        run: dotnet test --no-build --configuration Release

      - name: Pack
        run: |
          for project in FluentReport.Core FluentReport.Html FluentReport.Excel FluentReport.Rdlc; do
            dotnet pack src/$project/$project.csproj --no-build --configuration Release -p:Version=$PACKAGE_VERSION --output ./nupkgs
          done

      - name: Push to NuGet
        run: dotnet nuget push ./nupkgs/*.nupkg --api-key ${{ secrets.NUGET_FLUENT_API_KEY }} --source https://api.nuget.org/v3/index.json
