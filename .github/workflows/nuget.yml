name: Publish to NuGet

# The package version is <Version> in Directory.Build.props. Every push to main checks it against
# nuget.org: a new version is built, tested, published and tagged; an already published one is skipped.
# nuget.org never lets a version be overwritten, so bump <Version> to publish a change.
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  PACKAGES: FluentReport.Core FluentReport FluentReport.Html FluentReport.Excel FluentReport.Rdlc FluentReport.Cli

jobs:
  publish:
    name: Pack & Publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # push the release tag
      id-token: write   # OIDC token for nuget.org Trusted Publishing and Sigstore
      attestations: write   # build provenance attestations

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'

      - name: Read version
        run: |
          VERSION=$(dotnet msbuild src/FluentReport/FluentReport.csproj -getProperty:Version)
          echo "PACKAGE_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Version from Directory.Build.props: $VERSION"

      - name: Check nuget.org
        id: check
        run: |
          MISSING=""
          for id in $PACKAGES; do
            lower=$(echo "$id" | tr '[:upper:]' '[:lower:]')
            if curl -sf "https://api.nuget.org/v3-flatcontainer/$lower/index.json" | grep -q "\"$PACKAGE_VERSION\""; then
              echo "$id $PACKAGE_VERSION is already published"
            else
              MISSING="$MISSING $id"
            fi
          done
          echo "missing=$MISSING" >> "$GITHUB_OUTPUT"
          if [ -z "$MISSING" ]; then
            echo "::notice::$PACKAGE_VERSION is already on nuget.org; bump <Version> in Directory.Build.props to publish."
          fi

      - name: Restore dependencies
        if: steps.check.outputs.missing != ''
        run: dotnet restore --locked-mode

      - name: Build (Release)
        if: steps.check.outputs.missing != ''
        run: dotnet build --no-restore --configuration Release

      - name: Test
        if: steps.check.outputs.missing != ''
        run: dotnet test --no-build --configuration Release

      - name: Pack
        if: steps.check.outputs.missing != ''
        run: |
          for project in ${{ steps.check.outputs.missing }}; do
            dotnet pack src/$project/$project.csproj --no-build --configuration Release --output ./nupkgs
          done

      # Signed build provenance (Sigstore) for the packages and the assemblies inside them.
      # nuget.org adds its repository signature to every .nupkg, which changes the file's hash, but the
      # DLLs inside stay byte-identical, so consumers verify those: see "Verifying packages" in SECURITY.md.
      # The tool package (FluentReport.Cli) carries the same DLLs as the library packages.
      - name: Attest build provenance
        if: steps.check.outputs.missing != ''
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            nupkgs/*.nupkg
            src/FluentReport.Core/bin/Release/net10.0/FluentReport.Core.dll
            src/FluentReport/bin/Release/net10.0/FluentReport.dll
            src/FluentReport.Html/bin/Release/net10.0/FluentReport.Html.dll
            src/FluentReport.Excel/bin/Release/net10.0/FluentReport.Excel.dll
            src/FluentReport.Rdlc/bin/Release/net10.0/FluentReport.Rdlc.dll
            src/FluentReport.Cli/bin/Release/net10.0/FluentReport.Cli.dll

      # Trusted Publishing: exchanges the GitHub OIDC token for a short-lived nuget.org API key.
      # The policy on nuget.org trusts this repository and this workflow file only, so no
      # long-lived API key is stored in the repository secrets.
      - name: NuGet login (Trusted Publishing)
        if: steps.check.outputs.missing != ''
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: mathiasgonzalez

      - name: Push to NuGet
        if: steps.check.outputs.missing != ''
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push ./nupkgs/*.nupkg --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json

      - name: Tag release
        if: steps.check.outputs.missing != ''
        run: |
          TAG="v$PACKAGE_VERSION"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
            echo "$TAG already exists"
          else
            git tag "$TAG"
            git push origin "$TAG"
          fi
